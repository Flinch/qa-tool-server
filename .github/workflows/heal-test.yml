name: Heal Test

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Correlation ID linking this run back to a pending generation_runs row (kind=heal)'
        required: true
        type: string
      file_path:
        description: 'Repo-relative path to the single failing spec file to heal'
        required: true
        type: string
      context:
        description: 'Optional free-text context from the user for the healer agent (e.g. "flaky, run 10+ times")'
        required: false
        type: string
      engine:
        description: 'Suite engine — "api" routes to api-test-healer, anything else (or omitted) uses the browser healer'
        required: false
        type: string

permissions:
  contents: write # needed to push the healed-tests branch
  pull-requests: write # needed to open the PR

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Same reasoning as generate-tests.yml's identical step — a fresh CI
      # checkout is always an untrusted workspace, and --permission-mode
      # dontAsk silently denies tools like Edit in one without this.
      - name: Trust this workspace for Claude Code
        run: |
          node -e "
            const fs = require('fs');
            const file = process.env.HOME + '/.claude.json';
            const config = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf-8')) : {};
            config.projects = config.projects || {};
            config.projects[process.env.GITHUB_WORKSPACE] = {
              ...(config.projects[process.env.GITHUB_WORKSPACE] || {}),
              hasTrustDialogAccepted: true,
            };
            fs.writeFileSync(file, JSON.stringify(config));
          "

      # Per-project target URL/credentials — must run BEFORE Authenticate
      # below, which is what actually consumes TARGET_URL/TEST_USER_* via
      # playwright.config.js/helpers/auth.ts. correlation_id is a required
      # input on this workflow, unlike playwright.yml's optional one, so no
      # `if:` guard is needed here.
      - name: Fetch test environment
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node .github/scripts/fetch-run-config.js

      # Same reasoning as generate-tests.yml's identical step — the healer
      # needs the same authenticated storageState the generated Playwright
      # project starts from.
      - name: Authenticate (create storageState)
        run: npx playwright test --project=setup

      - name: Diagnose and heal
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          FILE_PATH: ${{ inputs.file_path }}
          CONTEXT: ${{ inputs.context }}
          ENGINE: ${{ inputs.engine }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GENERATION_COST_CAP_USD: ${{ vars.GENERATION_COST_CAP_USD || '5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/heal-test.js

      - name: Open PR with the fix
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: healed-tests/${{ inputs.correlation_id }}
          title: "Healed test: ${{ inputs.file_path }}"
          commit-message: "Heal failing test at ${{ inputs.file_path }}"
          add-paths: ${{ inputs.file_path }}
          body: |
            Automated "diagnose and heal" fix for a test that was failing in real suite execution (correlation id `${{ inputs.correlation_id }}`).
            ${{ inputs.context && format('**User-provided context:** {0}', inputs.context) || '' }}

            Review carefully before merging — if the healer left a `# POSSIBLE REGRESSION` + `test.fixme()` marker instead of a passing assertion, that means the app's real behavior changed rather than the test being wrong.

      - name: Report completion
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          BRANCH_NAME: healed-tests/${{ inputs.correlation_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/report-generation-complete.js
