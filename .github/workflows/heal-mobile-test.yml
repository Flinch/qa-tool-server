name: Heal Mobile Test

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Correlation ID linking this run back to a pending generation_runs row (kind=heal)'
        required: true
        type: string
      file_path:
        description: 'Repo-relative path to the single failing Maestro flow file to heal'
        required: true
        type: string
      context:
        description: 'Optional free-text context from the user for the healer agent (e.g. "flaky, run 10+ times")'
        required: false
        type: string

permissions:
  contents: write # needed to push the healed-mobile-tests branch
  pull-requests: write # needed to open the PR

jobs:
  heal:
    # Self-hosted, same reasoning as generate-mobile-tests.yml: the healer
    # needs a real, live connection to a real device for inspect_screen/run.
    runs-on: [self-hosted, mobile]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Add Maestro/Java to PATH
        run: |
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/openjdk/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Confirm a device is connected
        run: |
          adb devices -l
          maestro --version

      - name: Trust this workspace for Claude Code
        run: |
          node -e "
            const fs = require('fs');
            const file = process.env.HOME + '/.claude.json';
            const config = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf-8')) : {};
            config.projects = config.projects || {};
            config.projects[process.env.GITHUB_WORKSPACE] = {
              ...(config.projects[process.env.GITHUB_WORKSPACE] || {}),
              hasTrustDialogAccepted: true,
            };
            fs.writeFileSync(file, JSON.stringify(config));
          "

      - name: Diagnose and heal
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          FILE_PATH: ${{ inputs.file_path }}
          CONTEXT: ${{ inputs.context }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GENERATION_COST_CAP_USD: ${{ vars.GENERATION_COST_CAP_USD || '5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/heal-mobile-test.js

      - name: Open PR with the fix
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: healed-mobile-tests/${{ inputs.correlation_id }}
          title: "Healed mobile test: ${{ inputs.file_path }}"
          commit-message: "Heal failing flow at ${{ inputs.file_path }}"
          add-paths: ${{ inputs.file_path }}
          body: |
            Automated "diagnose and heal" fix for a Maestro flow that was failing in real suite execution (correlation id `${{ inputs.correlation_id }}`).
            ${{ inputs.context && format('**User-provided context:** {0}', inputs.context) || '' }}

            Review carefully before merging — if the healer left a `# POSSIBLE REGRESSION` comment + `flagged-regression` tag instead of a passing flow, that means the app's real behavior changed rather than the flow being wrong.

      - name: Report completion
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          BRANCH_NAME: healed-mobile-tests/${{ inputs.correlation_id }}
        run: node .github/scripts/report-generation-complete.js
