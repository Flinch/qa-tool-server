name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      suite_slug:
        description: 'Which suite to run (matches a folder under tests/)'
        required: true
        type: string
      run_correlation_id:
        description: 'Correlation ID linking this run back to a pending row in the DB'
        required: false
        type: string
      file_paths:
        description: 'Space-separated, repo-relative spec file paths to run instead of the whole suite (diagnostic re-run of specific failed tests)'
        required: false
        type: string
  schedule:
    - cron: '0 7 * * *' # 7am UTC nightly — adjust to whatever time you want

permissions:
  contents: write # needed to push the report to the gh-pages branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # AI-generated specs for a suite live in tests/generated/<slug>/, separate
      # from the hand-written tests/<slug>/ folder — a suite run has to check
      # both or generated tests are silently invisible to it. Passing a path
      # that has no matching files is safe (Playwright just finds 0 tests for
      # that arg, confirmed locally), so no existence check is needed here.
      #
      # When file_paths is set (a diagnostic re-run of specific previously-
      # failed tests, dispatched by the app rather than typed by hand), it
      # replaces the full-suite path entirely — Playwright accepts specific
      # spec file paths as positional args exactly like directories.
      - name: Determine suite
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLUG="${{ inputs.suite_slug }}"
          else
            SLUG="smoke"
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.file_paths }}" ]; then
            echo "path=${{ inputs.file_paths }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=tests/$SLUG tests/generated/$SLUG" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright tests
        continue-on-error: true
        env:
          CI: true
        run: npx playwright test ${{ steps.suite.outputs.path }}

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Report results to QA Tool
        if: always()
        env:
          SUITE_SLUG: ${{ steps.suite.outputs.slug }}
          TRIGGER_TYPE: ${{ github.event_name == 'schedule' && 'nightly' || 'manual' }}
          RUN_CORRELATION_ID: ${{ inputs.run_correlation_id }}
          PROJECT_ID: ${{ vars.QA_TOOL_PROJECT_ID }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.run_id }}/index.html
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node .github/scripts/report-results.js