name: Heal Test (OrangeHRM self-hosted)

# Project-7-specific variant of heal-test.yml: heals against a private,
# ephemeral, self-hosted OrangeHRM instance instead of the shared public demo
# — same reasoning and same seed as playwright-orangehrm.yml (see
# docker/orangehrm-seed/README.md). Without this, a healer run for project 7
# would fetch project_test_config's target_url/credentials via
# fetch-run-config.js and diagnose/fix against the old public demo, even
# though the failing run it's healing actually failed against the self-hosted
# instance.

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Correlation ID linking this run back to a pending generation_runs row (kind=heal)'
        required: true
        type: string
      file_path:
        description: 'Repo-relative path to the single failing spec file to heal'
        required: true
        type: string
      context:
        description: 'Optional free-text context from the user for the healer agent (e.g. "flaky, run 10+ times")'
        required: false
        type: string

permissions:
  contents: write # needed to push the healed-tests branch (and checkpoint branch on failure)
  pull-requests: write # needed to open the PR

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Explicit `docker run` steps, not a `services:` block — same
      # constraint as playwright-orangehrm.yml: `services:` containers boot
      # before `actions/checkout`, so they can't mount a file from this
      # checkout.
      - name: Start self-hosted OrangeHRM (db + web)
        run: |
          docker network create ohrm-net
          docker run -d --name db --network ohrm-net \
            -e MYSQL_ROOT_PASSWORD=rootpass123 \
            -e MYSQL_DATABASE=orangehrm \
            -e MYSQL_USER=orangehrm \
            -e MYSQL_PASSWORD=orangehrm123 \
            -v "${{ github.workspace }}/docker/orangehrm-seed:/docker-entrypoint-initdb.d:ro" \
            mariadb:10.4
          docker run -d --name web --network ohrm-net -p 8080:80 \
            -v "${{ github.workspace }}/docker/orangehrm-seed/Conf.php:/var/www/html/lib/confs/Conf.php:ro" \
            orangehrm/orangehrm:5.9

      - name: Wait for OrangeHRM to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8080/web/index.php/auth/login; then
              echo "OrangeHRM is up"
              exit 0
            fi
            sleep 2
          done
          echo "OrangeHRM never became ready" >&2
          docker logs db || true
          docker logs web || true
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Same reasoning as generate-tests.yml's identical step — a fresh CI
      # checkout is always an untrusted workspace, and --permission-mode
      # dontAsk silently denies tools like Edit in one without this.
      - name: Trust this workspace for Claude Code
        run: |
          node -e "
            const fs = require('fs');
            const file = process.env.HOME + '/.claude.json';
            const config = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf-8')) : {};
            config.projects = config.projects || {};
            config.projects[process.env.GITHUB_WORKSPACE] = {
              ...(config.projects[process.env.GITHUB_WORKSPACE] || {}),
              hasTrustDialogAccepted: true,
            };
            fs.writeFileSync(file, JSON.stringify(config));
          "

      # Fixed, known credentials from the seed — not pulled from
      # project_test_config/fetch-run-config.js like heal-test.yml does, same
      # reasoning as playwright-orangehrm.yml's "Determine suite" step.
      - name: Set test environment
        run: |
          echo "TARGET_URL=http://localhost:8080/" >> "$GITHUB_ENV"
          echo "TEST_USER_NAME=qatooladmin" >> "$GITHUB_ENV"
          echo "TEST_USER_PASSWORD=QaTool2026!Seed" >> "$GITHUB_ENV"

      # Same reasoning as generate-tests.yml's identical step — the healer
      # needs the same authenticated storageState the generated Playwright
      # project starts from.
      - name: Authenticate (create storageState)
        run: npx playwright test --project=setup

      - name: Diagnose and heal
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          FILE_PATH: ${{ inputs.file_path }}
          CONTEXT: ${{ inputs.context }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GENERATION_COST_CAP_USD: ${{ vars.GENERATION_COST_CAP_USD || '5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/heal-test.js

      - name: Open PR with the fix
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: healed-tests/${{ inputs.correlation_id }}
          title: "Healed test: ${{ inputs.file_path }}"
          commit-message: "Heal failing test at ${{ inputs.file_path }}"
          add-paths: ${{ inputs.file_path }}
          body: |
            Automated "diagnose and heal" fix for a test that was failing in real suite execution (correlation id `${{ inputs.correlation_id }}`), run against the self-hosted OrangeHRM instance.
            ${{ inputs.context && format('**User-provided context:** {0}', inputs.context) || '' }}

            Review carefully before merging — if the healer left a `# POSSIBLE REGRESSION` + `test.fixme()` marker instead of a passing assertion, that means the app's real behavior changed rather than the test being wrong.

      - name: Report completion
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          BRANCH_NAME: healed-tests/${{ inputs.correlation_id }}
        run: node .github/scripts/report-generation-complete.js

      - name: Tear down OrangeHRM containers
        if: always()
        run: |
          docker rm -f db web || true
          docker network rm ohrm-net || true
