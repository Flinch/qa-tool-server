name: Explore Mobile App

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: 'Correlation ID linking this run back to a pending generation_runs row (kind=explore)'
        required: true
        type: string
      platform:
        description: 'ios or android'
        required: true
        type: string
      instructions:
        description: 'Optional free-text guidance for this exploration pass (e.g. skip a section, target depth)'
        required: false
        type: string

# No contents/pull-requests permissions needed — unlike every other
# generation pipeline, this one never writes a file or opens a PR. It only
# posts a summary back over the webhook.
jobs:
  explore:
    # Self-hosted, not ubuntu-latest — same reasoning as generate-mobile-
    # tests.yml: the explorer agent needs a live, low-latency connection to a
    # real device for its inspect_screen/run loop.
    runs-on: [self-hosted, mobile]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Add Maestro/Java to PATH
        run: |
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/openjdk/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Confirm a device is connected
        run: |
          adb devices -l
          maestro --version

      - name: Trust this workspace for Claude Code
        run: |
          node -e "
            const fs = require('fs');
            const file = process.env.HOME + '/.claude.json';
            const config = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf-8')) : {};
            config.projects = config.projects || {};
            config.projects[process.env.GITHUB_WORKSPACE] = {
              ...(config.projects[process.env.GITHUB_WORKSPACE] || {}),
              hasTrustDialogAccepted: true,
            };
            fs.writeFileSync(file, JSON.stringify(config));
          "

      - name: Fetch test environment
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node .github/scripts/fetch-run-config.js

      - name: Explore app
        env:
          CORRELATION_ID: ${{ inputs.correlation_id }}
          WEBHOOK_BASE_URL: ${{ secrets.WEBHOOK_BASE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GENERATION_COST_CAP_USD: ${{ vars.GENERATION_COST_CAP_USD || '5' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INSTRUCTIONS: ${{ inputs.instructions }}
        run: node .github/scripts/explore-mobile-app.js
